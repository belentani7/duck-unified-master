<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUCK STUDIO - Tema Switcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
            color: #00ff9d;
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
        }

        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .theme-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-card:hover {
            border-color: #00ff9d;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.3);
            transform: translateY(-5px);
        }

        .theme-card.active {
            border-color: #00ff9d;
            background: rgba(0, 255, 157, 0.1);
            box-shadow: 0 0 50px rgba(0, 255, 157, 0.5);
        }

        .theme-name {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .theme-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
        }

        .color-preview {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .copy-css {
            width: 100%;
            padding: 8px;
            background: rgba(0, 255, 157, 0.2);
            border: 1px solid #00ff9d;
            color: #00ff9d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .copy-css:hover {
            background: rgba(0, 255, 157, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
        }

        .preview-section {
            margin-top: 60px;
            padding: 30px;
            background: rgba(0, 255, 157, 0.05);
            border: 2px solid rgba(0, 255, 157, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .preview-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #00ff9d;
        }

        .preview-components {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .preview-item {
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 8px;
            text-align: center;
        }

        .preview-button {
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(0, 255, 157, 0.1), rgba(0, 255, 157, 0.05));
            border: 1px solid #00ff9d;
            color: #00ff9d;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .preview-button:hover {
            background: linear-gradient(135deg, rgba(0, 255, 157, 0.3), rgba(0, 255, 157, 0.15));
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.5);
            transform: scale(1.05);
        }

        .preview-pad {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(187, 0, 255, 0.2), rgba(255, 0, 128, 0.2));
            border: 2px solid #bb00ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preview-pad:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(187, 0, 255, 0.5);
        }

        .copy-notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ff9d;
            color: #000;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }

        .copy-notification.show {
            opacity: 1;
            pointer-events: auto;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 157, 0.2);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .theme-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 DUCK STUDIO - Tema Switcher</h1>
        <p style="text-align: center; margin-bottom: 40px; color: rgba(255, 255, 255, 0.7);">
            Clique em um tema para visualizar e copiar o CSS
        </p>

        <div class="theme-grid" id="themeGrid"></div>

        <div class="preview-section">
            <div class="preview-title">🎬 Preview do Tema Selecionado</div>
            <div class="preview-components">
                <div class="preview-item">
                    <button class="preview-button">Button</button>
                </div>
                <div class="preview-item">
                    <div class="preview-pad">PAD</div>
                </div>
                <div class="preview-item">
                    <div style="
                        width: 100%;
                        height: 40px;
                        background: linear-gradient(90deg, var(--neon-primary), var(--neon-accent));
                        border-radius: 6px;
                        border: 1px solid var(--neon-primary);
                    "></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>💡 Dica: Copie o CSS e cole no DUCK-STUDIO-ANIMATED.html</p>
            <p>🦆 DUCK STUDIO © 2026 | Todos os temas customizáveis</p>
        </div>
    </div>

    <div class="copy-notification" id="copyNotif">✅ CSS copiado!</div>

    <script>
        // Temas disponíveis
        const themes = [
            {
                name: 'Forest Green',
                description: 'Tema original - verde neon + profissional',
                primary: '#00ff9d',
                secondary: '#00d97e',
                accent: '#00ffcc',
                purple: '#bb00ff',
                pink: '#ff0080',
                cyan: '#00d9ff',
                bg: '#050505'
            },
            {
                name: 'Cyberpunk Magenta',
                description: 'Futurista e agressivo - perfeito para EDM',
                primary: '#ff00ff',
                secondary: '#ff0080',
                accent: '#00ffff',
                purple: '#9d00ff',
                pink: '#ff00cc',
                cyan: '#00ffff',
                bg: '#0a0014'
            },
            {
                name: 'Ocean Blue',
                description: 'Calmo e elegante - ambient/chill',
                primary: '#00d9ff',
                secondary: '#0099ff',
                accent: '#00ffff',
                purple: '#0066ff',
                pink: '#00ccff',
                cyan: '#00ffff',
                bg: '#001a33'
            },
            {
                name: 'Vaporwave Sunset',
                description: 'Retrô estético - lo-fi beats',
                primary: '#ff006e',
                secondary: '#ff3d82',
                accent: '#ffbe0b',
                purple: '#8338ec',
                pink: '#ff006e',
                cyan: '#3a86ff',
                bg: '#1a0033'
            },
            {
                name: 'Royal Purple',
                description: 'Luxuoso e sofisticado - house/garage',
                primary: '#bb00ff',
                secondary: '#9d00ff',
                accent: '#ff00ff',
                purple: '#7700ff',
                pink: '#dd00ff',
                cyan: '#cc00ff',
                bg: '#1a0033'
            },
            {
                name: 'Retro Arcade',
                description: 'Divertido e clássico - gaming vibes',
                primary: '#ffff00',
                secondary: '#ff6600',
                accent: '#ff0099',
                purple: '#0099ff',
                pink: '#ff0099',
                cyan: '#00ffff',
                bg: '#0a0a0a'
            }
        ];

        // Renderizar cards
        const grid = document.getElementById('themeGrid');
        let activeTheme = 0;

        themes.forEach((theme, index) => {
            const card = document.createElement('div');
            card.className = 'theme-card' + (index === 0 ? ' active' : '');
            card.innerHTML = `
                <div class="theme-name">${theme.name}</div>
                <div class="theme-description">${theme.description}</div>
                <div class="color-preview">
                    <div class="color-swatch" style="background: ${theme.primary}"></div>
                    <div class="color-swatch" style="background: ${theme.secondary}"></div>
                    <div class="color-swatch" style="background: ${theme.accent}"></div>
                    <div class="color-swatch" style="background: ${theme.purple}"></div>
                </div>
                <button class="copy-css" data-index="${index}">📋 Copiar CSS</button>
            `;

            card.addEventListener('click', () => selectTheme(index));
            grid.appendChild(card);
        });

        // Função para selecionar tema
        function selectTheme(index) {
            activeTheme = index;
            const theme = themes[index];

            // Atualizar classe active
            document.querySelectorAll('.theme-card').forEach((card, i) => {
                card.classList.toggle('active', i === index);
            });

            // Atualizar preview
            document.documentElement.style.setProperty('--neon-primary', theme.primary);
            document.documentElement.style.setProperty('--neon-secondary', theme.secondary);
            document.documentElement.style.setProperty('--neon-accent', theme.accent);
            document.documentElement.style.setProperty('--neon-purple', theme.purple);
            document.documentElement.style.setProperty('--neon-pink', theme.pink);
            document.documentElement.style.setProperty('--neon-cyan', theme.cyan);
            document.documentElement.style.setProperty('--bg-primary', theme.bg);
        }

        // Event listeners para copiar CSS
        document.querySelectorAll('.copy-css').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const index = parseInt(btn.dataset.index);
                const theme = themes[index];

                const css = `:root {
    --neon-primary: ${theme.primary};
    --neon-secondary: ${theme.secondary};
    --neon-accent: ${theme.accent};
    --neon-purple: ${theme.purple};
    --neon-pink: ${theme.pink};
    --neon-cyan: ${theme.cyan};
    --bg-primary: ${theme.bg};
}`;

                // Copiar para clipboard
                navigator.clipboard.writeText(css).then(() => {
                    const notif = document.getElementById('copyNotif');
                    notif.classList.add('show');
                    setTimeout(() => notif.classList.remove('show'), 2000);
                });
            });
        });

        // Inicializar tema padrão
        selectTheme(0);
    </script>
</body>
</html>
