name: Deploy Production

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t duck-studio:latest .

      - name: Push to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login -u ${{ secrets.REGISTRY_USER }} --password-stdin
          docker tag duck-studio:latest ${{ secrets.REGISTRY }}/duck-studio:latest
          docker push ${{ secrets.REGISTRY }}/duck-studio:latest

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@$DEPLOY_HOST 'cd /app && docker-compose pull && docker-compose up -d'
